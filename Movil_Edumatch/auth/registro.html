<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMatch - Registro</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Header con botón atrás -->
        <div class="back-button">
            <a href="login.html">← Volver</a>
        </div>

        <div class="auth-header">
            <h1 class="page-title">Crear cuenta</h1>
            <p class="auth-subtitle">Únete a EduMatch hoy</p>
        </div>

        <!-- Selección de tipo de usuario -->
        <div class="user-type-selector">
            <button class="user-type-btn active" data-type="student">
                <span class="type-icon">🎓</span>
                <span>Estudiante</span>
            </button>
            <button class="user-type-btn" data-type="teacher">
                <span class="type-icon">👨‍🏫</span>
                <span>Profesor</span>
            </button>
        </div>

        <!-- Formulario de registro -->
        <form class="auth-form">
            <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input 
                    type="text" 
                    id="nombre" 
                    placeholder="Juan Pérez"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="ejemplo@correo.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="telefono">Teléfono</label>
                <input 
                    type="tel" 
                    id="telefono" 
                    placeholder="+593 999999999"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Mínimo 8 caracteres"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <input 
                    type="password" 
                    id="confirm-password" 
                    placeholder="Repite tu contraseña"
                    required
                >
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    Acepto los <a href="#">términos y condiciones</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Crear cuenta
            </button>
        </form>

        <!-- Login -->
        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </div>
</body>
</html>
