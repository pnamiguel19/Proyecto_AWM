<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMatch - Iniciar Sesión</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <div class="auth-container">
        <!-- Logo y título -->
        <div class="auth-header">
            <div class="logo-container">
                <div class="logo-circle">
                    <span class="logo-icon">📚</span>
                </div>
                <h1 class="app-title">EduMatch</h1>
            </div>
            <p class="auth-subtitle">Conecta con los mejores profesores</p>
        </div>

        <!-- Formulario de login -->
        <form class="auth-form">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="ejemplo@correo.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="••••••••"
                    required
                >
            </div>

            <div class="forgot-password">
                <a href="recuperar-password.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Iniciar Sesión
            </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
            <span>O continúa con</span>
        </div>

        <!-- Social login -->
        <div class="social-login">
            <button class="btn-social btn-google">
                <span class="social-icon">🔍</span>
                Google
            </button>
            <button class="btn-social btn-facebook">
                <span class="social-icon">📘</span>
                Facebook
            </button>
        </div>

        <!-- Registro -->
        <div class="auth-footer">
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </div>
</body>
</html>
