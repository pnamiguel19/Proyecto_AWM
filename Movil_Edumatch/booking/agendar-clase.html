<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMatch - Agendar Clase</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/booking.css">
</head>
<body>
    <div class="mobile-header">
        <div class="mobile-header-content">
            <a href="../student/buscar-profesores.html" class="back-link">←</a>
            <h1>Agendar Clase</h1>
        </div>
    </div>

    <div class="container">
        <!-- Teacher info -->
        <div class="booking-teacher-info">
            <img src="https://via.placeholder.com/60" alt="Profesor" class="avatar">
            <div class="teacher-details">
                <h3>María González</h3>
                <p>Matemáticas - Álgebra</p>
                <div class="rating">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span>5.0</span>
                </div>
            </div>
            <div class="price-badge">$15/hora</div>
        </div>

        <!-- Booking form -->
        <form class="booking-form">
            <h3>Detalles de la clase</h3>

            <div class="input-group">
                <label>Modalidad</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="modalidad" value="virtual" checked>
                        <span class="radio-label">
                            <span class="radio-icon">💻</span>
                            <span>Virtual</span>
                        </span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="modalidad" value="presencial">
                        <span class="radio-label">
                            <span class="radio-icon">🏫</span>
                            <span>Presencial</span>
                        </span>
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="input-group">
                <label>Horario</label>
                <div class="time-slots">
                    <button type="button" class="time-slot">09:00 AM</button>
                    <button type="button" class="time-slot active">10:00 AM</button>
                    <button type="button" class="time-slot">11:00 AM</button>
                    <button type="button" class="time-slot">02:00 PM</button>
                    <button type="button" class="time-slot">03:00 PM</button>
                    <button type="button" class="time-slot disabled">04:00 PM</button>
                </div>
            </div>

            <div class="input-group">
                <label for="duracion">Duración</label>
                <select id="duracion" required>
                    <option value="1">1 hora - $15</option>
                    <option value="1.5">1.5 horas - $22.50</option>
                    <option value="2">2 horas - $30</option>
                </select>
            </div>

            <div class="input-group">
                <label for="tema">Tema de la clase</label>
                <input type="text" id="tema" placeholder="Ej: Ecuaciones lineales" required>
            </div>

            <div class="input-group">
                <label for="notas">Notas adicionales (opcional)</label>
                <textarea id="notas" rows="3" placeholder="Agrega información que quieras compartir con el profesor"></textarea>
            </div>

            <!-- Summary -->
            <div class="booking-summary">
                <h4>Resumen</h4>
                <div class="summary-item">
                    <span>Clase de 1 hora</span>
                    <span>$15.00</span>
                </div>
                <div class="summary-item">
                    <span>Tarifa de servicio</span>
                    <span>$1.50</span>
                </div>
                <div class="divider"></div>
                <div class="summary-item total">
                    <span>Total</span>
                    <span>$16.50</span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">
                Continuar al pago
            </button>
        </form>
    </div>
</body>
</html>
