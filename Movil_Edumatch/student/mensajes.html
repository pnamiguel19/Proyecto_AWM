<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMatch - Mensajes</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/student.css">
</head>
<body>
    <div class="mobile-header">
        <div class="mobile-header-content">
            <h1>Mensajes</h1>
        </div>
    </div>

    <div class="container">
        <!-- Search -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" placeholder="Buscar conversaciones...">
        </div>

        <!-- Lista de conversaciones -->
        <div class="conversations-list">
            <div class="conversation-item active">
                <img src="https://via.placeholder.com/50" alt="Profesor" class="avatar">
                <div class="conversation-info">
                    <h4>María González</h4>
                    <p class="last-message">¿A qué hora nos vemos mañana?</p>
                </div>
                <div class="conversation-meta">
                    <span class="time">10:30 AM</span>
                    <span class="unread-badge">2</span>
                </div>
            </div>

            <div class="conversation-item">
                <img src="https://via.placeholder.com/50" alt="Profesor" class="avatar">
                <div class="conversation-info">
                    <h4>Carlos Ruiz</h4>
                    <p class="last-message">Te envié el material de estudio</p>
                </div>
                <div class="conversation-meta">
                    <span class="time">Ayer</span>
                </div>
            </div>

            <div class="conversation-item">
                <img src="https://via.placeholder.com/50" alt="Profesor" class="avatar">
                <div class="conversation-info">
                    <h4>Ana Torres</h4>
                    <p class="last-message">Perfecto, nos vemos el viernes</p>
                </div>
                <div class="conversation-meta">
                    <span class="time">2 días</span>
                </div>
            </div>

            <div class="conversation-item">
                <img src="https://via.placeholder.com/50" alt="Profesor" class="avatar">
                <div class="conversation-info">
                    <h4>Luis Medina</h4>
                    <p class="last-message">Gracias por la clase de hoy</p>
                </div>
                <div class="conversation-meta">
                    <span class="time">3 días</span>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="../home/home.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Inicio</span>
        </a>
        <a href="buscar-profesores.html" class="nav-item">
            <span class="nav-icon">🔍</span>
            <span>Buscar</span>
        </a>
        <a href="mis-clases.html" class="nav-item">
            <span class="nav-icon">📚</span>
            <span>Clases</span>
        </a>
        <a href="mensajes.html" class="nav-item active">
            <span class="nav-icon">💬</span>
            <span>Mensajes</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Perfil</span>
        </a>
    </nav>
</body>
</html>
